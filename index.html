<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>成长控制台</title>
<style>
  :root{
    --paper:#E7EAE4;
    --panel:#F3F5F0;
    --ink:#1F2A24;
    --ink-soft:#5B6960;
    --line:#C8CDC3;
    --accent:#3F6B4F;
    --urgent:#A8452C;
    --font-serif: 'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
    line-height:1.5;
    overflow-x:hidden;
  }
  .home{
    max-width:680px;
    margin:0 auto;
    padding:24px 16px 40px;
  }
  header{margin-bottom:24px;}
  header h1{
    font-family:var(--font-serif);
    font-size:1.5rem;
    font-weight:600;
    margin:0 0 4px;
  }
  header p{margin:0;color:var(--ink-soft);font-size:0.85rem;}

  /* always-visible countdown */
  .hero-countdown{
    background:var(--panel);
    border:1px solid var(--line);
    padding:20px;
    margin-bottom:20px;
  }
  .countdown-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .countdown-num{font-family:var(--font-serif);font-size:3rem;font-weight:700;line-height:1;}
  .countdown-num.urgent{color:var(--urgent);}
  .countdown-label{color:var(--ink-soft);font-size:0.9rem;}
  .date-setting{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--ink-soft);}
  .date-setting input{
    font-family:var(--font-sans);border:1px solid var(--line);background:#fff;
    padding:6px 8px;border-radius:2px;color:var(--ink);
  }

  /* button grid */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tile{
    background:var(--panel);
    border:1px solid var(--line);
    padding:18px 14px;
    text-align:left;
    font-family:var(--font-sans);
    cursor:pointer;
    color:var(--ink);
  }
  .tile:active{border-color:var(--accent);}
  .tile .tile-title{font-size:0.98rem;font-weight:600;display:block;margin-bottom:4px;}
  .tile .tile-sub{font-size:0.78rem;color:var(--ink-soft);display:block;}
  .tile.disabled{opacity:0.45;cursor:default;}
  a.tile{display:block;text-decoration:none;}

  /* slide-up panel */
  .panel-overlay{
    position:fixed;inset:0;
    background:rgba(20,26,22,0.35);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
    z-index:10;
  }
  .panel-overlay.open{opacity:1;pointer-events:auto;}

  .panel-sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:680px;
    margin:0 auto;
    max-height:88vh;
    background:var(--paper);
    border-top:1px solid var(--line);
    transform:translateY(100%);
    transition:transform .28s ease;
    z-index:11;
    display:flex;
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .panel-sheet.open{transform:translateY(0);}

  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .panel-head h2{
    font-family:var(--font-serif);font-size:1.15rem;margin:0;
  }
  .panel-close{
    background:none;border:none;font-size:1.3rem;color:var(--ink-soft);
    cursor:pointer;padding:4px 8px;
  }
  .panel-body{
    padding:16px;
    overflow-y:auto;
  }

  /* score rows (reused inside panel) */
  .row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:10px 0;border-bottom:1px solid var(--line);
  }
  .row:last-of-type{border-bottom:none;}
  .row .name{flex:1;}
  .row .name .item-cat{margin-top:6px;}
  .row input[type=text], .row select{
    font-family:var(--font-sans);border:1px solid var(--line);background:#fff;
    padding:6px 8px;border-radius:2px;color:var(--ink);font-size:0.9rem;
  }
  .row input[type=text]{width:100%;}
  .row input[type=number]{
    width:70px;text-align:right;font-family:var(--font-sans);border:1px solid var(--line);
    background:#fff;padding:6px 8px;border-radius:2px;color:var(--ink);font-size:0.95rem;
  }
  .total-line{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:14px;padding-top:14px;border-top:2px solid var(--ink);
  }
  .total-line .num{font-family:var(--font-serif);font-size:1.8rem;font-weight:700;}
  .hint{font-size:0.8rem;color:var(--ink-soft);margin-top:10px;}
  button.add-btn{
    width:100%;margin-top:12px;padding:10px;background:transparent;
    border:1px dashed var(--line);border-radius:2px;color:var(--ink-soft);
    font-family:var(--font-sans);font-size:0.88rem;cursor:pointer;
  }
  .remove-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:1rem;padding:2px 6px;}

  .entry-card{
    background:var(--panel);border:1px solid var(--line);
    padding:14px;margin-bottom:12px;
  }
  .entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .entry-head input[type=text]{
    font-family:var(--font-serif);font-size:1rem;font-weight:600;
    border:none;background:transparent;color:var(--ink);padding:0;flex:1;
  }
  .entry-head input[type=date]{
    border:1px solid var(--line);background:#fff;padding:4px 6px;
    border-radius:2px;font-size:0.8rem;color:var(--ink-soft);font-family:var(--font-sans);
  }
  .entry-field{margin-bottom:10px;}
  .entry-field label{display:block;font-size:0.78rem;color:var(--ink-soft);margin-bottom:4px;}
  .entry-field textarea{
    width:100%;min-height:52px;resize:vertical;
    font-family:var(--font-sans);border:1px solid var(--line);background:#fff;
    padding:8px;border-radius:2px;color:var(--ink);font-size:0.9rem;line-height:1.4;
  }
  .entry-field.key textarea{border-color:var(--accent);}

  footer{text-align:center;color:var(--ink-soft);font-size:0.78rem;margin-top:30px;}

  .ai-fab{
    position:fixed;
    right:18px;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:54px;height:54px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;
    font-family:var(--font-serif);font-size:1.3rem;font-weight:700;
    box-shadow:0 3px 10px rgba(31,42,36,0.25);
    cursor:pointer;z-index:14;
    display:flex;align-items:center;justify-content:center;
  }
  .ai-fab:active{transform:scale(0.95);}

  .chat-log{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .bubble{max-width:85%;padding:10px 12px;border-radius:3px;font-size:0.9rem;line-height:1.45;white-space:pre-wrap;}
  .bubble.user{align-self:flex-end;background:var(--accent);color:#fff;}
  .bubble.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);}
  .bubble.sys{align-self:center;color:var(--ink-soft);font-size:0.78rem;background:none;}
  .chat-input-row{display:flex;gap:8px;position:sticky;bottom:0;background:var(--paper);padding-top:8px;}
  .chat-input-row textarea{
    flex:1;min-height:42px;max-height:120px;resize:vertical;
    font-family:var(--font-sans);border:1px solid var(--line);background:#fff;
    padding:8px;border-radius:2px;color:var(--ink);font-size:0.9rem;
  }
  .chat-send{
    background:var(--accent);color:#fff;border:none;padding:0 16px;
    border-radius:2px;cursor:pointer;font-family:var(--font-sans);font-size:0.88rem;
  }
  .classify-result{
    margin-top:12px;padding:12px;background:var(--panel);border:1px solid var(--line);
    font-size:0.88rem;white-space:pre-wrap;line-height:1.5;
  }

  @media (prefers-reduced-motion: reduce){
    .panel-sheet, .panel-overlay{transition:none;}
  }
</style>
</head>
<body>

<div class="home">
  <header>
    <h1>成长控制台</h1>
    <p>选你所爱，爱你所选</p>
  </header>

  <div class="hero-countdown">
    <div class="countdown-row">
      <div class="countdown-num" id="countdownNum">—</div>
      <div class="countdown-label">天 · 距离 SPM</div>
    </div>
    <div class="date-setting">
      <label for="spmDate">考试日期：</label>
      <input type="date" id="spmDate">
    </div>
  </div>

  <div class="grid">
    <button class="tile" data-panel="scorePanel">
      <span class="tile-title">积分追踪</span>
      <span class="tile-sub">职位 · 阅读 · 比赛</span>
    </button>
    <button class="tile disabled" disabled>
      <span class="tile-title">情报中心</span>
      <span class="tile-sub">下一批加入</span>
    </button>
    <button class="tile disabled" disabled>
      <span class="tile-title">日志与复盘</span>
      <span class="tile-sub">下一批加入</span>
    </button>
    <button class="tile" data-panel="setbackPanel">
      <span class="tile-title">挫折复盘本</span>
      <span class="tile-sub">输了什么 · 学到什么</span>
    </button>
    <a class="tile" href="https://my-drift-bottle.vercel.app/" target="_blank" rel="noopener">
      <span class="tile-title">倾诉 ↗</span>
      <span class="tile-sub">匿名心理漂流瓶 · 外部链接</span>
    </a>
  </div>
</div>

<footer>数据只存在你这台设备的浏览器里（IndexedDB），换设备不会同步。</footer>

<!-- overlay + sheet for score panel -->
<div class="panel-overlay" id="overlay"></div>
<div class="panel-sheet" id="scorePanel">
  <div class="panel-head">
    <h2>积分追踪</h2>
    <button class="panel-close" aria-label="关闭">×</button>
  </div>
  <div class="panel-body">
    <datalist id="categorySuggestions">
      <option value="职位">
      <option value="阅读计划">
      <option value="校外比赛">
    </datalist>
    <div id="scoreRows"></div>
    <button class="add-btn" id="addRowBtn">+ 添加一项</button>
    <div class="total-line">
      <span>合计</span>
      <span class="num" id="totalScore">0</span>
    </div>
    <p class="hint">分数对照你学校的评分表自行填写——这个数字没有统一标准，以你老师给的表为准。</p>
  </div>
</div>

<div class="panel-sheet" id="setbackPanel">
  <div class="panel-head">
    <h2>挫折复盘本</h2>
    <button class="panel-close" aria-label="关闭">×</button>
  </div>
  <div class="panel-body">
    <button class="add-btn" id="addSetbackBtn" style="margin-top:0;margin-bottom:10px;">+ 记一次挫折</button>
    <button class="add-btn" id="classifyBtn" style="margin-top:0;margin-bottom:14px;">✦ AI 帮我看看这些可以怎么分类</button>
    <div class="classify-result" id="classifyResult" style="display:none;"></div>
    <div id="setbackList"></div>
    <p class="hint">重点不是记"输了"，是写清楚第五格——现在回头看，判断错在哪。这个才是面试时讲得出故事的部分。</p>
  </div>
</div>

<button class="ai-fab" id="aiFab" aria-label="AI助手">问</button>

<div class="panel-sheet" id="aiPanel">
  <div class="panel-head">
    <h2>跟 AI 聊</h2>
    <button class="panel-close" aria-label="关闭">×</button>
  </div>
  <div class="panel-body">
    <div class="chat-log" id="chatLog">
      <div class="bubble sys">还没连后端的话这里会报错，看下面部署说明</div>
    </div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="比如：今天经历的事要怎么安排/分类？"></textarea>
      <button class="chat-send" id="chatSendBtn">发送</button>
    </div>
  </div>
</div>

<script>
const DB_NAME = 'growth_console';
const DB_VERSION = 2;
let db;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
      if (!d.objectStoreNames.contains('scoreItems')) d.createObjectStore('scoreItems', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('setbacks')) d.createObjectStore('setbacks', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}
function txStore(storeName, mode){ return db.transaction(storeName, mode).objectStore(storeName); }

async function getSetting(key){
  return new Promise((resolve) => {
    const req = txStore('settings','readonly').get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror = () => resolve(null);
  });
}
async function setSetting(key, value){
  return new Promise((resolve) => {
    const req = txStore('settings','readwrite').put({ key, value });
    req.onsuccess = () => resolve(true);
    req.onerror = () => resolve(false);
  });
}
async function getAllScoreItems(){
  return new Promise((resolve) => {
    const items = [];
    const req = txStore('scoreItems','readonly').openCursor();
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor){ items.push(cursor.value); cursor.continue(); } else resolve(items);
    };
    req.onerror = () => resolve([]);
  });
}
async function addScoreItem(item){
  return new Promise((resolve) => {
    const req = txStore('scoreItems','readwrite').add(item);
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => resolve(null);
  });
}
async function updateScoreItem(item){
  return new Promise((resolve) => {
    const req = txStore('scoreItems','readwrite').put(item);
    req.onsuccess = () => resolve(true);
    req.onerror = () => resolve(false);
  });
}
async function deleteScoreItem(id){
  return new Promise((resolve) => {
    const req = txStore('scoreItems','readwrite').delete(id);
    req.onsuccess = () => resolve(true);
    req.onerror = () => resolve(false);
  });
}

function renderCountdown(dateStr){
  const numEl = document.getElementById('countdownNum');
  if (!dateStr){ numEl.textContent = '—'; numEl.classList.remove('urgent'); return; }
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diffDays = Math.ceil((target - now) / 86400000);
  numEl.textContent = diffDays >= 0 ? diffDays : 0;
  numEl.classList.toggle('urgent', diffDays <= 60 && diffDays >= 0);
}

function rowTemplate(item){
  const div = document.createElement('div');
  div.className = 'row';
  div.dataset.id = item.id;
  div.innerHTML = `
    <div class="name">
      <input type="text" class="item-name" placeholder="项目名称，比如 篮球主席" value="${item.name ? item.name.replace(/"/g,'&quot;') : ''}">
      <input type="text" class="item-cat" list="categorySuggestions" placeholder="分类" value="${item.category ? item.category.replace(/"/g,'&quot;') : ''}">
    </div>
    <input type="number" class="item-score" value="${item.score || 0}" step="0.5">
    <button class="remove-btn" title="删除">×</button>
  `;
  return div;
}

async function renderScoreRows(){
  const container = document.getElementById('scoreRows');
  container.innerHTML = '';
  const items = await getAllScoreItems();
  items.forEach(item => container.appendChild(rowTemplate(item)));
  updateTotal(items);
}
function updateTotal(items){
  const total = items.reduce((sum, it) => sum + (parseFloat(it.score) || 0), 0);
  document.getElementById('totalScore').textContent = total;
}
async function handleRowChange(e){
  const row = e.target.closest('.row');
  if (!row) return;
  const id = Number(row.dataset.id);
  if (e.target.classList.contains('remove-btn')){
    await deleteScoreItem(id);
    row.remove();
    updateTotal(await getAllScoreItems());
    return;
  }
  const name = row.querySelector('.item-name').value;
  const category = row.querySelector('.item-cat').value;
  const score = parseFloat(row.querySelector('.item-score').value) || 0;
  await updateScoreItem({ id, name, category, score });
  updateTotal(await getAllScoreItems());
}

async function getAllSetbacks(){
  return new Promise((resolve) => {
    const items = [];
    const req = txStore('setbacks','readonly').openCursor();
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor){ items.push(cursor.value); cursor.continue(); } else resolve(items.reverse());
    };
    req.onerror = () => resolve([]);
  });
}
async function addSetback(item){
  return new Promise((resolve) => {
    const req = txStore('setbacks','readwrite').add(item);
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => resolve(null);
  });
}
async function updateSetback(item){
  return new Promise((resolve) => {
    const req = txStore('setbacks','readwrite').put(item);
    req.onsuccess = () => resolve(true);
    req.onerror = () => resolve(false);
  });
}
async function deleteSetback(id){
  return new Promise((resolve) => {
    const req = txStore('setbacks','readwrite').delete(id);
    req.onsuccess = () => resolve(true);
    req.onerror = () => resolve(false);
  });
}

const SETBACK_FIELDS = [
  { key:'situation', label:'当时的情况' },
  { key:'action',    label:'我当时的决定/行动' },
  { key:'result',    label:'结果是什么' },
  { key:'misjudge',  label:'现在回头看，哪里判断错了', key2:true },
  { key:'redo',      label:'现在会怎么做不同的选择', key2:true }
];

function setbackCardTemplate(item){
  const div = document.createElement('div');
  div.className = 'entry-card';
  div.dataset.id = item.id;
  const fieldsHtml = SETBACK_FIELDS.map(f => `
    <div class="entry-field${f.key2 ? ' key' : ''}">
      <label>${f.label}</label>
      <textarea data-field="${f.key}" placeholder="写下来...">${item[f.key] ? item[f.key].replace(/</g,'&lt;') : ''}</textarea>
    </div>
  `).join('');
  div.innerHTML = `
    <div class="entry-head">
      <input type="text" class="entry-title" data-field="title" placeholder="事件名称" value="${item.title ? item.title.replace(/"/g,'&quot;') : ''}">
      <input type="date" class="entry-date" data-field="date" value="${item.date || ''}">
      <button class="remove-btn" title="删除">×</button>
    </div>
    ${fieldsHtml}
  `;
  return div;
}

async function renderSetbacks(){
  const container = document.getElementById('setbackList');
  container.innerHTML = '';
  const items = await getAllSetbacks();
  items.forEach(item => container.appendChild(setbackCardTemplate(item)));
}

async function handleSetbackChange(e){
  const card = e.target.closest('.entry-card');
  if (!card) return;
  const id = Number(card.dataset.id);
  if (e.target.classList.contains('remove-btn')){
    await deleteSetback(id);
    card.remove();
    return;
  }
  const field = e.target.dataset.field;
  if (!field) return;
  const updated = { id };
  updated.title = card.querySelector('[data-field="title"]').value;
  updated.date = card.querySelector('[data-field="date"]').value;
  SETBACK_FIELDS.forEach(f => {
    updated[f.key] = card.querySelector(`[data-field="${f.key}"]`).value;
  });
  await updateSetback(updated);
}

// panel open/close
function openPanel(panelId){
  document.getElementById(panelId).classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeAllPanels(){
  document.querySelectorAll('.panel-sheet').forEach(p => p.classList.remove('open'));
  document.getElementById('overlay').classList.remove('open');
}

// ---- AI backend call ----
// 你部署后端后，这里的 URL 换成你自己的 /api/chat 路径（相对路径就行，同一个域名下不用改）
const AI_ENDPOINT = '/api/chat';

async function askAI(userPrompt, systemPrompt){
  const fullUrl = new URL(AI_ENDPOINT, window.location.origin).toString();
  let res;
  try {
    res = await fetch(AI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: userPrompt, system: systemPrompt || '' })
    });
  } catch (networkErr){
    throw new Error('网络请求本身没发出去（' + networkErr.message + '），实际请求的地址是：' + fullUrl);
  }
  const bodyText = await res.text();
  if (!res.ok){
    throw new Error('状态码 ' + res.status + '，地址：' + fullUrl + '，服务器返回内容：' + bodyText.slice(0, 300));
  }
  let data;
  try { data = JSON.parse(bodyText); } catch(e){
    throw new Error('返回的不是JSON，原文：' + bodyText.slice(0,300));
  }
  return data.reply || '(AI 没有返回内容)';
}

function appendBubble(text, type){
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'bubble ' + type;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function handleChatSend(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  appendBubble(text, 'user');
  input.value = '';
  appendBubble('思考中...', 'sys');
  try {
    const reply = await askAI(text);
    document.querySelector('#chatLog .bubble.sys:last-child').remove();
    appendBubble(reply, 'ai');
  } catch (err){
    document.querySelector('#chatLog .bubble.sys:last-child').remove();
    appendBubble('出错了：' + err.message, 'sys');
  }
}

async function handleClassify(){
  const resultBox = document.getElementById('classifyResult');
  const items = await getAllSetbacks();
  if (items.length === 0){
    resultBox.style.display = 'block';
    resultBox.textContent = '还没有记录，先去写几条挫折复盘。';
    return;
  }
  const packed = items.map((it, i) =>
    `${i+1}. 【${it.title || '未命名'}】${it.situation || ''} / 判断错在：${it.misjudge || ''}`
  ).join('\n');
  const systemPrompt = '你是一个帮学生梳理成长记录的助手，不要安慰，不要鸡汤，直接按主题分类（比如：人际关系、学习方法、比赛心态、时间管理等），每类列出对应的条目编号，用简短的中文输出。';
  resultBox.style.display = 'block';
  resultBox.textContent = '分析中...';
  try {
    const reply = await askAI(packed, systemPrompt);
    resultBox.textContent = reply;
  } catch (err){
    resultBox.textContent = '出错了：' + err.message;
  }
}

async function init(){
  db = await openDB();

  const savedDate = await getSetting('spmDate');
  if (savedDate){ document.getElementById('spmDate').value = savedDate; renderCountdown(savedDate); }
  document.getElementById('spmDate').addEventListener('change', async (e) => {
    await setSetting('spmDate', e.target.value);
    renderCountdown(e.target.value);
  });

  await renderScoreRows();

  document.getElementById('scoreRows').addEventListener('input', handleRowChange);
  document.getElementById('scoreRows').addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-btn')) handleRowChange(e);
  });
  document.getElementById('addRowBtn').addEventListener('click', async () => {
    await addScoreItem({ name:'', category:'职位', score:0 });
    await renderScoreRows();
  });

  await renderSetbacks();
  document.getElementById('setbackList').addEventListener('input', handleSetbackChange);
  document.getElementById('setbackList').addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-btn')) handleSetbackChange(e);
  });
  document.getElementById('addSetbackBtn').addEventListener('click', async () => {
    const id = await addSetback({ title:'', date:'', situation:'', action:'', result:'', misjudge:'', redo:'' });
    await renderSetbacks();
  });

  document.querySelectorAll('.tile[data-panel]').forEach(btn => {
    btn.addEventListener('click', () => openPanel(btn.dataset.panel));
  });
  document.getElementById('aiFab').addEventListener('click', () => openPanel('aiPanel'));
  document.getElementById('chatSendBtn').addEventListener('click', handleChatSend);
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleChatSend(); }
  });
  document.getElementById('classifyBtn').addEventListener('click', handleClassify);
  document.querySelectorAll('.panel-close').forEach(btn => {
    btn.addEventListener('click', closeAllPanels);
  });
  document.getElementById('overlay').addEventListener('click', closeAllPanels);
}

init();
</script>
</body>
</html>
